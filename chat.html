
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHOLA AI - Tamil AI Assistant</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0c111b;
 color:white;
 font-family:Arial,sans-serif;
 height:100vh;
 display:flex;
 flex-direction:column;
}
header{
 padding:18px;
 text-align:center;
 background:#090e17;
 border-bottom:1px solid #b99445;
 color:#ffe7ae;
 font-size:23px;
 font-weight:bold;
}
#chat{
 flex:1;
 overflow-y:auto;
 padding:20px;
}
.welcome{
 text-align:center;
 margin-top:15vh;
}
.welcome h1{color:#ffe7ae}
.message{
 max-width:800px;
 margin:15px auto;
 padding:15px;
 border-radius:15px;
 background:#1b2637;
 white-space:pre-wrap;
 line-height:1.8;
 overflow-wrap:anywhere;
}
.user{background:#293b53}
#composer{
 padding:15px;
 background:#101827;
 border-top:1px solid #b99445;
}
textarea{
 width:100%;
 min-height:65px;
 padding:14px;
 border-radius:12px;
 border:1px solid #b99445;
 background:#080d19;
 color:white;
 font-size:16px;
 resize:vertical;
}
.buttons{
 display:flex;
 gap:8px;
 margin-top:10px;
 flex-wrap:wrap;
}
button,.upload{
 padding:11px 17px;
 border:0;
 border-radius:10px;
 background:#edc66e;
 color:#1a1306;
 font-weight:bold;
 cursor:pointer;
}
.secondary{
 background:#263449;
 color:white;
}
#file{display:none}
#preview{color:#ffe7ae;padding:8px}
.note{
 text-align:center;
 font-size:12px;
 color:#9ba8ba;
 margin-top:10px;
}
</style>
</head>

<body>

<header>⚜ CHOLA AI ⚜</header>

<div id="chat">
 <div class="welcome" id="welcome">
  <h1>வணக்கம்! CHOLA AI</h1>
  <p>உங்கள் கேள்விகளைக் கேளுங்கள்.</p>
  <p>தமிழிலும் ஆங்கிலத்திலும் பேசலாம்!</p>
 </div>
</div>

<div id="composer">

 <div id="preview"></div>

 <textarea id="question"
 placeholder="CHOLA AI-யிடம் கேளுங்கள்..."></textarea>

 <div class="buttons">
  <label class="upload" for="file">📷 படம் தேர்வு</label>
  <input type="file" id="file" accept="image/*">

  <button onclick="sendMessage()">அனுப்பு ↑</button>

  <button class="secondary" onclick="newChat()">
   புதிய Chat
  </button>

  <button class="secondary" onclick="clearChat()">
   🗑 Delete
  </button>
 </div>

 <div class="note">
  CHOLA AI STUDIO · தமிழ் AI Assistant
 </div>

</div>

<script>
const chat=document.getElementById("chat");
const question=document.getElementById("question");
const file=document.getElementById("file");

file.addEventListener("change",()=>{
 document.getElementById("preview").textContent=
 file.files.length ? "தேர்ந்தெடுத்த படம்: "+file.files[0].name : "";
});

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function sendMessage(){
 const text=question.value.trim();
 const photo=file.files[0];

 if(!text && !photo){
  alert("கேள்வி அல்லது படத்தைத் தேர்வு செய்யுங்கள்");
  return;
 }

 document.getElementById("welcome").style.display="none";

 if(photo){
  const img=document.createElement("img");
  img.src=URL.createObjectURL(photo);
  img.style.maxWidth="220px";
  img.style.display="block";
  img.style.margin="10px auto";
  chat.appendChild(img);
 }

 addMessage(text || "படத்தைப் பற்றி விளக்கவும்","user");

 addMessage(
  "வணக்கம்! இது CHOLA AI-யின் ஆரம்ப வடிவமைப்பு. உண்மையான AI பதில்களைப் பெற Backend மற்றும் AI API இணைப்பு இன்னும் செய்யப்பட வேண்டும்.",
  "assistant"
 );

 question.value="";
 file.value="";
 document.getElementById("preview").textContent="";
}

function newChat(){
 chat.innerHTML="";
 const welcome=document.createElement("div");
 welcome.className="welcome";
 welcome.innerHTML="<h1>வணக்கம்! CHOLA AI</h1><p>புதிய உரையாடலைத் தொடங்குங்கள்.</p>";
 chat.appendChild(welcome);
}

function clearChat(){
 if(confirm("இந்த உரையாடலை நீக்க வேண்டுமா?")){
  newChat();
 }
}

question.addEventListener("keydown",function(e){
 if(e.key==="Enter" && !e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});
</script>

</body>
</html>
